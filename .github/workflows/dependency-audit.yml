name: dependency-audit

permissions:
  contents: read

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

# Advisory databases can change without a source commit. Keep the first rollout
# visible but non-blocking; promote to a required check after the initial baseline
# has an owner and documented exception policy.
jobs:
  rust-advisories:
    runs-on: macos-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable, 2026-06-30
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Rust lockfile
        run: cargo audit --file desktop/src-tauri/Cargo.lock

  npm-advisories:
    runs-on: macos-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Audit production npm dependencies
        working-directory: desktop
        run: npm audit --omit=dev --audit-level=high
